version: '3.8'

services:
  # The Backend API Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=recruitpass
      - DB_NAME=recruitment
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - recruit-network

  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=recruitpass
      - POSTGRES_DB=recruitment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recruit-network

  # MinIO Object Storage Service
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - recruit-network

networks:
  recruit-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data: